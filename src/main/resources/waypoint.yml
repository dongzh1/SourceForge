# SourceForge 追踪路标 v2 — 发包展示的世界内路标(基于 PacketEvents 的 Text Display，不生成真实实体)
#
# 玩家用 /sf track 添加追踪目标后，会在"到目的地方向"渲染一个跟随玩家视角悬浮的三行文字：图标、
# 目标名称、距离（例如 "◆"、"撤离点"、"11m"），实时刷新。目标很远时路标停在玩家面前固定距离处，
# 只指方向；玩家靠近后图标自然"追上"到真实目的地坐标——不是两套逻辑切换，同一条公式
# (渲染位置 = 视角位置 + 方向 × min(真实距离, max-hover-distance)) 自然过渡，见
# nav/PacketWaypointRenderer.kt 顶部说明。
#
# 支持同时追踪多个目标(与 /sf track 本身的能力一致)：每个追踪目标各自一个路标，颜色取该目标在
# /sf track 时指定的颜色（与 BetterHud 弹窗/指南针同色），互不干扰、各自独立套用上面那条公式。
#
# 出于带宽/服务器性能考虑：只对"正在追踪的那个玩家"单独发包(不广播给附近玩家)，且只在坐标/文字
# 实际发生变化时才重发对应的那一种包(位置不变不发 teleport，数字不变不发 metadata)。移动过程用
# Text Display 独有的插值动画平滑过渡(生成时设一次 teleport_duration，客户端自己在这几个 tick 内
# 滑过去，不是瞬移)，所以更新周期调大也不会看起来"一跳一跳"——两个目标(省包量/视觉平滑)不冲突。
# 依赖 PacketEvents 插件；未安装时本功能自动跳过，不影响 SourceForge 其它功能。
enabled: true

# 位置更新周期(tick，20=1秒)，同时也是每次移动的插值滑动时长——下一次更新预计在这么多 tick 后
# 到达，滑动刚好在那之前走完。数值越大发包越少、但目标移动很快时路标追得越"松弛"；默认6tick(~3.3
# 次/秒)在人数较多的服务器上比逐tick省数倍包量，视觉上仍然是连续滑动而不是瞬移，不建议低于2。
update-interval-ticks: 6

# 图标悬浮在玩家视角前的最大距离(格)。目标比这个还远时，图标固定停在这个距离处只指方向；
# 目标进入这个距离内后，图标改为直接停在目标真实坐标（同一套 min(真实距离,该值) 公式自然过渡）。
max-hover-distance: 8.0

# 同时渲染的路标数量上限（一个追踪目标一个路标）。追踪目标数超过这个值时只渲染最近的这么多个，
# 防止一次追踪很多目标导致刷屏或发包量线性失控。默认5，与 BetterHud 追踪弹窗的显示行数上限一致。
max-markers: 5

# 图标字符。默认用一个普通 Unicode 符号，无需任何资源包即可显示；如果服务器资源包定义了自定义
# 字体图标（参考 CraftEngine/BetterHud 的自定义字体图标做法），把 icon-font 填上对应命名空间键
# （如 "sourceforge:icon"）即可切换成自定义图标字形，留空则用原版内置字体渲染 icon-glyph。
icon-glyph: "◆"
icon-font: ""

# 路标整体（图标、目标名称、距离，同一个 Text Display 三行）的缩放。
scale: 1.6

# 距离文字格式，%distance% 替换成取整后的米数。
distance-format: "%distance%m"

# 文字背景色（ARGB 压缩 int，默认 0 = 全透明，只看到文字本身不带底板）。
background-argb: 0

# 文字是否带阴影（更容易在明亮背景前看清）。
has-shadow: true

# 无视方块遮挡显示（Text Display 原生 see_through 特性，不是发光效果之类的绕路方案）。默认开启——
# 路标是导航用的，被墙挡住就失去意义；如果不想要"透视"观感，改成 false 用正常的遮挡渲染。
see-through: true
