duskgold_pickaxe:
  material: NETHERITE_PICKAXE
  display-name: "&7下界暗金镐"
  ce-id: "sourceforge:duskgold_pickaxe"
  weapon-category: pickaxe
  effective-slots: [ mainhand ]
  chunkworld-level: "15"
  affixes: [ base_damage, critical_damage ]
  # 2026-07-17 新增：暗金第一条工具线（此前只有武器/护甲）。数值定位比同tier的剑略低
  # (镐子不是主战武器，base_damage 只是捎带的次要属性)，其余分阶规则与其余暗金装备一致，
  # 见 docs/数值设计.md §8。MOD 挂载对象：连锁挖矿/黑曜石爆破等"pickaxe"分类MOD只能装在这上面。
  tier-affixes:
    1:
      base_damage: 4.2
    2:
      base_damage: 5.5
    3:
      base_damage: 6.7
      critical_damage: 0.15
  # CE战斗装备分类下的装备要求(用户2026-07-13)：允许铁砧完全自由操作(改名/修复/合并/附魔书附魔)，
  # 不受 SourceEnchantListener 的白名单限制——以后新增的战斗装备也要照抄这一条。
  free-anvil-edit: true
