duskgold_crossbow:
  material: CROSSBOW
  display-name: "&7下界暗金弩"
  ce-id: "sourceforge:duskgold_crossbow"
  weapon-category: crossbow
  effective-slots: [ mainhand ]
  chunkworld-level: "15"
  affixes: [ base_damage, critical_damage ]
  # 2026-07-13：弓弩攻击方式分化，弩基础伤害×0.6(原7.8→4.68)，换成右键直接射箭(见
  # CrossbowInstantFireListener)，冷却0.2s，可被装在右键触发栏的技能MOD顶替。
  # 2026-07-17 新增 tier2/3：数值设计见 docs/数值设计.md §8，规则同下界暗金剑。
  tier-affixes:
    1:
      base_damage: 4.68
    2:
      base_damage: 6.1
    3:
      base_damage: 7.5
      critical_damage: 0.15
  # CE战斗装备分类下的装备要求(用户2026-07-13)：允许铁砧完全自由操作(改名/修复/合并/附魔书附魔)，
  # 不受 SourceEnchantListener 的白名单限制——以后新增的战斗装备也要照抄这一条。
  free-anvil-edit: true
