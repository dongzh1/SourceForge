duskgold_sword:
  material: NETHERITE_SWORD
  display-name: "&7下界暗金剑"
  ce-id: "sourceforge:duskgold_sword"
  weapon-category: melee_light
  effective-slots: [ mainhand ]
  chunkworld-level: "15"
  affixes: [ base_damage, critical_damage ]
  # 2026-07-17 新增 tier2/3：数值设计见 docs/数值设计.md §8。tier2≈现有值×1.3，
  # tier3≈×1.6并追加暴击伤害词条(向文档T5-6"+20~40%暴伤"锚点靠拢，取更保守下限)。
  # 只能靠重铸(UPGRADE蓝图)从下一级往上升，CREATE配方仍固定 tier1，不能一步锻造出高阶暗金。
  tier-affixes:
    1:
      base_damage: 4.9
    2:
      base_damage: 6.4
    3:
      base_damage: 7.8
      critical_damage: 0.15
  # CE战斗装备分类下的装备要求(用户2026-07-13)：允许铁砧完全自由操作(改名/修复/合并/附魔书附魔)，
  # 不受 SourceEnchantListener 的白名单限制——以后新增的战斗装备也要照抄这一条。
  free-anvil-edit: true
