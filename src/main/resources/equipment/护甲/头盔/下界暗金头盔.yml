duskgold_helmet:
  material: NETHERITE_HELMET
  display-name: "&7下界暗金头盔"
  ce-id: "sourceforge:duskgold_helmet"
  # 暂定：L15尚无护甲流派(套盾/医疗/肉盾)分化，先归到 mods.capacity 已有的 armor_physical 类别，
  # 等流派设计定稿后可能需要调整。
  weapon-category: armor_physical
  effective-slots: [ head ]
  chunkworld-level: "15"
  # 2026-07-17 修正：暗金护甲线原本误写成了 armor 词条，应为 shield_capacity(护盾，常驻生命提升，
  # 见 affixes.yml 说明)。同时新增 tier2/3：tier2≈×1.3，tier3≈×1.6并追加少量真实 armor 词条作为
  # 分阶点缀。数值设计见 docs/数值设计.md §8。只能靠重铸(UPGRADE蓝图)逐级往上升。
  affixes: [ shield_capacity, health, armor ]
  tier-affixes:
    1:
      shield_capacity: 2.2
      health: 7.2
    2:
      shield_capacity: 2.9
      health: 9.4
    3:
      shield_capacity: 3.5
      health: 11.5
      armor: 1.1
  # CE战斗装备分类下的装备要求(用户2026-07-13)：允许铁砧完全自由操作(改名/修复/合并/附魔书附魔)，
  # 不受 SourceEnchantListener 的白名单限制——以后新增的战斗装备也要照抄这一条。
  free-anvil-edit: true
