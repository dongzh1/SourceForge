duskgold_chestplate:
  material: NETHERITE_CHESTPLATE
  display-name: "&7下界暗金胸甲"
  ce-id: "sourceforge:duskgold_chestplate"
  weapon-category: armor_physical
  effective-slots: [ chest ]
  chunkworld-level: "15"
  # 2026-07-17 修正：暗金护甲线原本误写成了 armor 词条，应为 shield_capacity(护盾，见 affixes.yml)。
  # 同时新增 tier2/3，数值设计见 docs/数值设计.md §8，规则同下界暗金头盔。
  affixes: [ shield_capacity, health, armor ]
  tier-affixes:
    1:
      shield_capacity: 3.9
      health: 7.2
    2:
      shield_capacity: 5.1
      health: 9.4
    3:
      shield_capacity: 6.2
      health: 11.5
      armor: 2.0
  # CE战斗装备分类下的装备要求(用户2026-07-13)：允许铁砧完全自由操作(改名/修复/合并/附魔书附魔)，
  # 不受 SourceEnchantListener 的白名单限制——以后新增的战斗装备也要照抄这一条。
  free-anvil-edit: true
