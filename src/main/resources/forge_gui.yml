# ============================================================================
# 锻造界面（Forge GUI）布局配置
# ============================================================================
# 2026-07-16 重构：锻造 / 强化 / 重铸 三种模式已经是三个完全独立的界面(各自独立的 Inventory)，
# 不再共用一套槽位——点击模式切换按钮时会关闭当前界面、打开另一模式对应的全新界面。
# 三段配置各自互不影响，槽位号在不同段里重复完全没问题(它们是不同的箱子)；
# 只需要保证同一段内部 blueprint/upgrade-weapon/action/output/mode-toggle 互不相同，
# 也不落在自己的 materials 列表里——ForgeConfig 启动时会按段校验并在日志里报错。
#
# 所有文本字段（title / name / lore）均支持完整 MiniMessage 语法，
# 包括 CraftEngine 自定义标签：<image>、<shift>、<font>、<i18n>、<gradient>、<rainbow> 等，
# 同时向后兼容传统 §/& 颜色码（会自动转换为 MiniMessage）。
# 槽位编号从 0 起算。
# ----------------------------------------------------------------------------

# 动作按钮三态外观（三种模式共用）。每态含：material（物品）、name（名称）、lore（基础描述行）。
# 运行时会在 lore 之后追加动态行（如锻造剩余秒数 + 进度条、材料是否充足提示）。
buttons:
  hammer:
    material: "minecraft:iron_axe"
    name: "<green>开始锻造"
    lore:
      - "<gray>放入蓝图开始锻造，或放入武器进行强化"
  progress:
    material: "minecraft:spectral_arrow"
    name: "<yellow>锻造中…"
    lore: []
  collect:
    material: "minecraft:spectral_arrow"
    name: "<green>点击收取"
    lore: []

# 仅当各段 title 为空（无背景图）时，用此材料填充空槽（三种模式共用）。
filler-material: "minecraft:gray_stained_glass_pane"

# ----------------------------------------------------------------------------
# 锻造模式：蓝图槽 + 材料展示 + 产出预览 + 动作/模式切换按钮。
# ----------------------------------------------------------------------------
craft:
  size: 45
  # 暂时关闭背景图，改用玻璃板+文字标签（原因：新增槽位跟背景图的槽位对齐反复出问题，
  # 先用不依赖像素级对齐的方案跑通功能，背景图美术工作量另行安排）。留空 "" = 无背景图。
  title: ""
  slots:
    blueprint: 20
    action: 22
    output: 24
    mode-toggle: 23
    materials: [10, 11, 12, 13, 14, 15, 16]
    barriers: []

# ----------------------------------------------------------------------------
# 强化模式：只留一个武器槽（强化只花钱不消耗材料，用户明确要求——不需要材料展示槽/蓝图槽）
# + 产出(强化后)预览 + 动作/模式切换按钮。
# ----------------------------------------------------------------------------
enhance:
  size: 45
  title: ""
  slots:
    weapon: 20
    action: 22
    output: 24
    mode-toggle: 23
    barriers: []

# ----------------------------------------------------------------------------
# 重铸模式：蓝图槽 + 待重铸武器槽 + 材料展示 + 产出预览 + 动作/模式切换按钮。
# ----------------------------------------------------------------------------
upgrade:
  size: 45
  title: ""
  slots:
    blueprint: 20
    upgrade-weapon: 19
    action: 22
    output: 24
    mode-toggle: 23
    materials: [10, 11, 12, 13, 14, 15, 16]
    barriers: []
