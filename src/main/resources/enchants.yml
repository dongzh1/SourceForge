# SourceForge 原版附魔桥接 v4
#
# SF 装备可以正常带原版附魔——获取渠道是【村民交易(附魔书) + 铁砧】，附魔台对 SF 装备维持禁用（原因
# 见下方 allowed 段说明）。默认放行除"两个诅咒"外的全部原版附魔：诅咒对锻造出来的装备只有负面效果
# （消失诅咒烧毁装备、绑定诅咒纯粹添堵），其余附魔和 SF 自身的暴击/元素/护盾/技能体系不冲突——原版
# 附魔是叠加在 SF 数值体系之上的独立增益层，两者各自结算、互不覆盖。
#
# 战斗系统识别这些附魔效果的方式（代码见 enchant/VanillaEnchantBridge.kt）：
#   - 输出向(锋利/横扫之刃/亡灵杀手/截肢杀手/火焰附加/抢夺)：真实挥砍原版自动结算(暴击/元素照常在这
#     个数字上继续算)；SF 的技能命中(粒子轮子/MM技能)是脚本直接调伤害，绕开原版结算路径，靠下面几个
#     数值旋钮手动补算，确保技能流玩家也吃得到这些附魔。
#   - 防御向(保护/烈焰保护/爆炸保护/弹射物保护/摔落保护)：SF 对玩家用自研攻防公式换掉了原版全部减伤
#     阶段(含护甲附魔原本所在的那一档)，这里在自研公式算完后再乘一层原版附魔减伤。原版是每点等级减
#     4%、封顶80%，数值策划(2026-07-08)认为"护甲叠满只能有80%免伤"过于超标，下调成每点减2%、封顶
#     30%(见下方 armor-protection 段)——标准满配(4件保护IV=16点×2%=32%)刚好卡在封顶线附近。
#   - 荆棘：受击时按等级概率反弹固定伤害给攻击者，是主动 proc，不需要额外配置。
#   - 其余(水下速掘/深海探索/丝绸之手/精准采集/经验修补/急迫/抢夺矿脉等)：不碰 SF 的伤害管线，放行后
#     原版直接生效，不需要额外代码。
#
# allowed 段留空(默认状态)= 放行除诅咒外全部原版附魔，各自等级上限用原版本身的最高等级。
# 想收紧成白名单模式，取消下面的注释并按需增删（附魔 id 用原版命名空间 key，小写下划线；等级为允许
# 的最高等级，超过会被夹紧；一旦这个段落非空，就只放行这里列出的附魔，其余全部清除）：
# allowed:
#   looting: 3
#   fire_aspect: 2
#   smite: 5
#   bane_of_arthropods: 5
#   sharpness: 5
#   sweeping_edge: 3
#   protection: 4
#   fire_protection: 4
#   blast_protection: 4
#   projectile_protection: 4
#   feather_falling: 4
#   thorns: 3

# 抢夺：每层为死亡掉落列表中的每一条独立判定 +1 份额外掉落的概率（贴近原版"额外判定次数"的直觉，
# 而不是粗暴地整体翻倍）。与摸尸(MOD技能)的范围死亡翻倍是相乘关系：抢夺先卷出基础掉落，摸尸再翻倍。
looting:
  extra-roll-chance-per-level: 0.25

# 亡灵杀手 / 截肢杀手：每级额外伤害（与原版数值一致）。锋利用原版公式(level×0.5+0.5)硬编码在
# VanillaEnchantBridge，不在此处配置。
smite-bonus-per-level: 2.5
bane-bonus-per-level: 2.5

# 横扫之刃：简化为固定每级伤害加成（不还原原版的范围扫击机制，真实挥砍时原版扫击对周围目标的效果
# 仍会自然生效，这里只补技能命中打不到的那部分）。
sweeping-edge-bonus-per-level: 1.0

# 火焰附加：每级点燃时长（tick，20=1秒），与原版一致。
fire-aspect-ticks-per-level: 80

# 护甲防护家族(保护/烈焰/爆炸/弹射物保护/摔落保护)减伤曲线。原版口径是"每点EPF减4%、封顶20点=最多
# 减80%"；数值策划要求下调，这里改成两个独立旋钮：每点减伤% + 硬顶(无论怎么堆附魔都不会超过这条线)。
# 默认组合下，标准满配(4件护甲全上保护IV=16点EPF)算出32%，被硬顶夹到30%——即"护甲叠满≈30%减免"。
armor-protection:
  reduction-per-epf-point: 0.02
  max-reduction: 0.30
