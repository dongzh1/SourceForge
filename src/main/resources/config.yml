gui:
  # 锻造界面的纯文字标题回退：仅当 forge_gui.yml 的 title 为空串 "" 时使用。
  title: "&0源质锻造"

# 锻造界面布局已迁移到专用文件 forge_gui.yml（首次启用时自动生成于插件数据目录）。
# 槽位、按钮三态外观（material/name/lore，支持完整 MiniMessage 含 <image>/<shift>/<gradient>）、
# 背景图标题等全部在 forge_gui.yml 中配置。本文件不再有 forge-ui 段。

debug:
  combat: false

# 玩家基础魔力值（能量/MANA 上限 = base + 装备 energy_max 词条之和，见 forge/EnergyService.kt）。
mana:
  base: 100.0

# 震刀（parry）技能MOD 参数（见 mods/parry.yml / ParryListener）
# 右键展开架势窗口，窗口内被实体/弹射物命中则完全免疫该次伤害并累积「架势」。
parry:
  window-ticks: 100      # 架势窗口时长(tick)，100=5s
  mana-cost: 8.0         # 展开架势消耗的 MANA(能量)
  cooldown-ms: 500       # 一次格挡后再次展开的冷却(毫秒)
  slow-amplifier: 4      # 展开瞬间的减速等级(amplifier，对齐原 MM SLOW level=4)
  slow-ticks: 20         # 减速持续(tick)，20=1s；设 0 关闭

# 三段斩（triple_slash）技能MOD 参数（见 mods/triple_slash.yml / skills/triple_slash.js）
# 左键挥砍推进连段，对前方扇形造成「SF 基础伤害 × 段位倍率」的 AoE 斩击。
triple-slash:
  reset-ticks: 40        # 连段重置窗口(tick)，超过则从第1段重来，40=2s
  cooldown-ms: 250       # 段内 CD(毫秒)，防止一次挥砍多段
  radius: 3.0            # 斩击半径(格)
  arc: 120.0             # 斩击扇形角度(度)
  min-base: 1.0          # 基础伤害下限(无 SF 装备时的兜底基准)
  dmg-mult-1: 1.0        # 第1段伤害倍率
  dmg-mult-2: 1.2        # 第2段伤害倍率
  dmg-mult-3: 1.8        # 第3段(收招重斩)伤害倍率

# 月华斩（crescent_slash）技能MOD 参数（见 mods/crescent_slash.yml / skills/crescent_slash.js）。
# 装进武器「左键」技能触发栏，左键挥砍斩出 180° 半圆弧(PacketEvents 一次性发包)，
# 对扇形内目标造成「SF 基础伤害 × dmg-mult」并叠 1 层火(heat)元素。
crescent-slash:
  cooldown-ms: 600       # 挥砍冷却(毫秒)
  radius: 4.5            # 半圆弧半径(格)
  arc: 180.0             # 扇形角度(度)，180=正半圆
  points: 28             # 弧线粒子点数(越多越密，发包量越大)
  dmg-mult: 1.3          # 评审#9：1.6→1.3，配合联动倍率(dash×1.3/retreat×1.35)使连斩峰值 ≤1.8×base
  min-base: 1.0          # 基础伤害下限(无 SF 装备时兜底基准)

# ===== 触发栏技能套 · 剑客·机动 =====
dash-thrust:            # 冲刺突进(右键栏)
  cooldown-ms: 7000
  power: 1.4            # 冲刺力度
  up: 0.25             # 上抛
  range: 6.0           # 前方光束射程
  dmg-mult: 1.0        # 命中倍率(×base_damage)
  mana: 18.0
  combo-seconds: 3.0   # "突进"联动窗口
wind-retreat:          # 疾风撤退(Shift+右键栏)
  cooldown-ms: 6000
  power: 1.2           # 后跃力度
  up: 0.35
  mana: 16.0
  speed-ticks: 40      # 撤退后迅捷时长
  combo-seconds: 2.5   # "撤退"联动窗口

# ===== 触发栏技能套 · 守卫·防反 =====
iron-stance:           # 铁壁架势(Shift+F栏，持续)
  open-mana: 10.0      # 开架势一次性消耗
  upkeep-per-sec: 4.0  # 每秒维持耗蓝
  block-mana: 8.0      # 评审#3：每次完全格挡的能量代价(蓝不足则不免疫，仅减伤)
  resistance-amp: 1    # 评审#3：减伤等级(Resistance II=-40%)
  slow-amp: 0          # 架势自减速等级(0=关)
  block-cooldown-ms: 1500  # 两次完全格挡最小间隔
  parry-seconds: 1.0   # 评审#6：破绽窗口(< block-cooldown，须格挡后立即盾击才算完美反击)
shield-bash:           # 盾击反震(右键栏)
  cooldown-ms: 5000    # 评审#6：4s→5s，抑制强控链
  mana: 12.0
  radius: 3.0
  arc: 120.0
  dmg-mult: 0.8        # 基础倍率(完美反击时×2)
  knockback: 0.9
  stun-ticks: 15       # 命中硬直(缓慢)时长
ground-slam:           # 震地(空中栏)
  cooldown-ms: 6000
  mana: 18.0
  radius: 4.5
  dmg-mult: 1.4
  knockback: 0.7
  slam-down: 1.6       # 向下猛砸力度

# 附魔台抽奖（右键附魔台打开抽奖界面，放入空白 MOD + 消耗经验抽取随机 MOD）
# required-bookshelves: 打开界面所需的环绕书架数（类似原版顶级附魔台）；在附魔台周围 5×5 外圈、上下两层统计书架。设 0 关闭此限制。
lottery:
  xp-cost: 30
  required-bookshelves: 16

# BetterHud 集成：每次 MM 技能进入冷却时弹出一个 popup（按技能名堆叠，最多由
# BetterHud 端 max-stack 控制）。CD 结束时由本插件主动移除。
# popup 布局里可用的条目变量（通过 BetterHud 的 (custom_variable:键) 读取）：
#   skill          技能内部名（建议配合自定义字体显示）
#   cooldown       冷却秒数（一位小数）
#   cooldown_ticks 冷却总 tick（用于自定义进度条）
betterhud:
  enabled: true
  skill-cd-popup: "sourceforge_skill_cd"
  # 坐标追踪导航 popup 名（/sf track 使用）。布局可用的条目变量见 docs。
  navigator-popup: "sourceforge_navigator"
  # 任务列表 popup 名（由 SourceForgeTaskTrackerAPI 统一驱动）。
  task-tracker-popup: "sourceforge_task_tracker"
  # 推送 popup 的全链路诊断日志（getPopup/getHudPlayer/show 各步骤打到控制台）。
  # 也可用 /sf debug betterhud on 临时开启。
  debug: false

forge:
  guarantee-material-affix: true

# 源质锻炉多方块结构（3×3×3 空心立方，核心居中，26 个外壳同层级）
# 锻造时长 ticks = round(base-time-seconds * (层级序号*per-tier + base) / 外壳倍率 * 20)
forge-structure:
  enabled: true
  core-block: "sourceforge:forge_core"
  # 外壳层级 -> CE 方块 id
  shell-blocks:
    iron: "sourceforge:forge_shell_iron"
    gold: "sourceforge:forge_shell_gold"
    diamond: "sourceforge:forge_shell_diamond"
    netherite: "sourceforge:forge_shell_netherite"
  # 外壳层级 -> 速度倍率(锻造耗时 = 配方秒数 / 这个倍率，越高越快)
  shell-multipliers:
    iron: 1.0
    gold: 1.5
    diamond: 2.0
    netherite: 3.0
  hammer: "sourceforge:forge_hammer"

# 源质锻炉作业持久化(2026-07-13 从本地文件迁移到 MySQL)。需要自行准备一个 MySQL 实例并把下面
# 改成真实地址/账号——建库建表都是插件自己做的(见 ForgeDatabase)，只要账号有对应库的建表/读写权限。
# 连不上时源质锻炉的多方块功能本次启动会禁用(看日志)，插件其余功能不受影响。
database:
  host: "localhost"
  port: 3306
  name: "sourceforge"
  username: "root"
  password: ""
  pool-size: 5

mods:
  gui-title: "&0源质改造"
  # 技能触发栏数量（0..6）。每个触发栏固定对应一种操作：
  #   0 左键 · 1 右键 · 2 Shift+左键 · 3 Shift+右键 · 4 Shift+F(换手) · 5 空中(跳跃时左键)
  # 技能MOD 装进哪个触发栏就由那种操作触发(onActivate)；用 allowed-triggers 白名单约束能放哪些栏
  # （例：mods/crescent_slash.yml 的砍击只允许 left）。默认 6=全开。
  skill-slots: 6
  capacity:
    melee_light: {base: 30, tier-increment: 10}
    melee_heavy: {base: 30, tier-increment: 10}
    polearm: {base: 30, tier-increment: 10}
    bow: {base: 30, tier-increment: 10}
    crossbow: {base: 30, tier-increment: 10}
    firearm: {base: 30, tier-increment: 10}
    summon: {base: 30, tier-increment: 10}
    armor_physical: {base: 24, tier-increment: 8}
    armor_magic: {base: 24, tier-increment: 8}
    default: {base: 20, tier-increment: 5}
  max-mod-slots:
    melee_light: 8
    melee_heavy: 8
    polearm: 8
    bow: 8
    crossbow: 8
    firearm: 8
    summon: 8
    armor_physical: 6
    armor_magic: 6
    default: 6

score:
  base-per-tier: 100.0
  min-score: 1
  price:
    multiplier-base: 0.5
    score-divisor: 250.0
    min-price: 1.0
  combat-weights:
    default: 5.0
    base_damage: 10.0
    summon_damage: 10.0
    critical_chance: 120.0
    critical_damage: 90.0
    status_chance: 5.0
    armor: 15.0
    health: 8.0
    shield_capacity: 8.0
    energy_max: 6.0
    ability_strength: 12.0
    ability_duration: 6.0
    ability_efficiency: 8.0
    ability_range: 8.0
  affix-weights: {}

blueprint-item: {}

blueprints: {}
# 装备定义已迁移到独立的 equipment/ 文件夹（支持任意深度中文子文件夹分类），见该目录，本文件不再有 equipment: 段。
